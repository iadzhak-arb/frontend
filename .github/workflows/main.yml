name: Main workflow
run-name: Main workflow by ${{ github.actor }}
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and push to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Prepare .env for Vite
        run: |
          echo "VITE_YANDEX_METRICA=${{ secrets.VITE_YANDEX_METRICA }}" > .env
      - name: Set up Doker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker
        uses: docker/build-push-action@v4
        with:
          context: ./
          push: true
          tags: ${{ secrets.DOCKER_USER }}/arb-frontend:latest