server {
    listen 80;
    server_name arbcrypto.ru www.arbcrypto.ru;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        autoindex off;
        default_type application/pdf;
        try_files $uri =404;
    }
}